name: BRASA Windows native validation
on:
  push:
    branches: [build/brasa-acoustic-vst3-20260911]
    paths: [.github/workflows/brasa-windows-validation.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack authored source
        shell: python
        run: |
          import pathlib, base64, hashlib, io, tarfile
          chunks=sorted(pathlib.Path('.brasa-ci').glob('source.part*'))
          assert len(chunks)==5
          for p in chunks: print(p, len(p.read_bytes()), hashlib.sha256(p.read_bytes()).hexdigest())
          data=base64.b64decode(''.join(p.read_text().strip() for p in chunks),validate=True)
          assert hashlib.sha256(data).hexdigest()=='5e862734a6404f4877f7d4885a938bed54289b601ce70f0047e56c878f4c1a3e', 'SOURCE TRANSFER INTEGRITY FAILURE'
          pathlib.Path('brasa').mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as t: t.extractall('brasa',filter='data')
          for d in ['src','assets','docs/evidence','licenses','grooves','presets']: pathlib.Path('brasa',d).mkdir(parents=True,exist_ok=True)
      - name: Install build and independent test dependencies
        shell: pwsh
        run: |
          python -m pip install 'numpy<3' soundfile mido 'pedalboard==0.9.23' pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Acquire pinned CC-BY sample data
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/freepats/muldjordkit.git source-kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source-kit checkout --detach 719fe72bc6693b94f1229674e202881145ab44ed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python brasa/tools/build_bank.py source-kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('brasa/assets/BRASA.bank').read_bytes()).hexdigest()=='c6338342bf440b6e5d0940521fd4e5176a8f4b391e1058e5eb6626f2fddd8714'"
      - name: Generate authored content and build Windows VST3
        id: build
        shell: pwsh
        run: |
          python brasa/tools/make_content.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ --version
          python brasa/tools/build_windows.py 2>&1 | Tee-Object -FilePath brasa/docs/evidence/windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force brasa/dist/windows/BRASA.vst3/Contents/Resources
          Copy-Item brasa/assets/BRASA.bank brasa/dist/windows/BRASA.vst3/Contents/Resources/BRASA.bank
          python -c "import pathlib,hashlib,json,platform; p=pathlib.Path('brasa/dist/windows/BRASA.vst3/Contents/x86_64-win/BRASA.vst3'); pathlib.Path('brasa/docs/evidence/windows-binary.json').write_text(json.dumps({'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'os':platform.platform(),'python':platform.python_version()},indent=2))"
      - name: Independent Windows VST3 host audio and state validation
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          python brasa/tests/host_tests.py 2>&1 | Tee-Object -FilePath brasa/docs/evidence/windows-host.log
          exit $LASTEXITCODE
      - name: Real HWND and GDI+ editor interaction smoke test
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          python brasa/tests/windows_gui.py 2>&1 | Tee-Object -FilePath brasa/docs/evidence/windows-gui.log
          exit $LASTEXITCODE
      - name: Export tested binary and evidence (no duplicate sample bank)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRASA-Windows-Native-Validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            brasa/dist/windows/BRASA.vst3/Contents/x86_64-win/BRASA.vst3
            brasa/docs/evidence/
            brasa/docs/sample-manifest.json
            brasa/licenses/
